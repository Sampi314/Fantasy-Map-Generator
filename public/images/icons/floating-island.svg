<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" />
    </filter>
    <radialGradient id="aura" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#9fd8c0" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#9fd8c0" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#9fd8c0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3ef" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#bfe3ef" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- cast shadow on the ground far below -->
  <ellipse cx="32" cy="58" rx="15" ry="3.2" fill="#2f3a33" opacity="0.35" filter="url(#soft)" />

  <!-- spiritual aura -->
  <ellipse cx="32" cy="28" rx="27" ry="22" fill="url(#aura)" />

  <!-- companion rocks -->
  <path d="M9 32 l5 -2 4 2 -2 5 -5 1 z" fill="#7d7166" stroke="#57504a" stroke-width="0.8" />
  <path d="M51 26 l4 -1.5 3.5 1.8 -1.5 4 -4.5 0.7 z" fill="#7d7166" stroke="#57504a" stroke-width="0.8" />

  <!-- island underside: hanging rock tapering to a point -->
  <path d="M12 24 L18 34 L24 39 L30 45 L33 46 L38 41 L45 35 L52 24 Z"
        fill="#8a7f72" stroke="#57504a" stroke-width="1.2" stroke-linejoin="round" />
  <path d="M22 26 L26 36 L31 44 M42 26 L38 37" stroke="#6d635a" stroke-width="1" fill="none" opacity="0.8" />

  <!-- waterfall threads spilling off the edge -->
  <path d="M44 25 q0.5 8 -1 14" stroke="url(#fall)" stroke-width="2" fill="none" />
  <path d="M20 25 q-0.5 6 0.5 10" stroke="url(#fall)" stroke-width="1.4" fill="none" />

  <!-- grassy top -->
  <path d="M10 23 Q18 18 32 18 Q46 18 54 23 Q46 27 32 27 Q18 27 10 23 Z"
        fill="#7aa96b" stroke="#4f7a45" stroke-width="1.2" />
  <path d="M14 22.5 Q24 19.5 34 20 M28 24 Q40 24.5 50 22.5" stroke="#5c8a52" stroke-width="0.9" fill="none" opacity="0.9" />

  <!-- pine tree -->
  <path d="M25 19 L28.5 12 L32 19 Z" fill="#3f6b3a" stroke="#2e4f2b" stroke-width="0.8" />
  <path d="M25.8 15.5 L28.5 9.5 L31.2 15.5 Z" fill="#4a7a44" stroke="#2e4f2b" stroke-width="0.8" />
  <rect x="27.9" y="19" width="1.3" height="2.4" fill="#5b4633" />

  <!-- tiny shrine with red roof -->
  <rect x="37.4" y="15.6" width="3.4" height="3.4" fill="#e8dcc8" stroke="#8a6f52" stroke-width="0.6" />
  <path d="M36.2 15.8 L39.1 12.8 L42 15.8 Z" fill="#b3402e" stroke="#7e2c20" stroke-width="0.6" />
</svg>
