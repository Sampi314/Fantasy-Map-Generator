<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" />
    </filter>
    <radialGradient id="aura2" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c8b8e8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#c8b8e8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#c8b8e8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3ef" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#bfe3ef" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- cast shadow on the ground far below -->
  <ellipse cx="32" cy="59" rx="12" ry="2.8" fill="#2f3a33" opacity="0.35" filter="url(#soft2)" />

  <!-- spiritual aura -->
  <ellipse cx="32" cy="30" rx="24" ry="24" fill="url(#aura2)" />

  <!-- companion stones circling the spire -->
  <path d="M12 22 l4 -1.5 3 1.8 -1.5 3.5 -4 0.5 z" fill="#7d7166" stroke="#57504a" stroke-width="0.8" />
  <path d="M49 38 l3.5 -1.2 2.8 1.5 -1.2 3.2 -3.8 0.5 z" fill="#7d7166" stroke="#57504a" stroke-width="0.8" />

  <!-- tall spire rock tapering far down -->
  <path d="M20 25 L23 36 L27 45 L31 52 L33 52 L37 44 L41 35 L44 25 Z"
        fill="#8a7f72" stroke="#57504a" stroke-width="1.2" stroke-linejoin="round" />
  <path d="M27 27 L30 40 L32 50 M38 27 L36 38" stroke="#6d635a" stroke-width="1" fill="none" opacity="0.8" />

  <!-- waterfall thread -->
  <path d="M38 26 q0.5 7 -0.5 12" stroke="url(#fall2)" stroke-width="1.6" fill="none" />

  <!-- grassy summit ledge -->
  <path d="M18 24 Q25 20.5 32 20.5 Q39 20.5 46 24 Q39 27 32 27 Q25 27 18 24 Z"
        fill="#7aa96b" stroke="#4f7a45" stroke-width="1.2" />

  <!-- three-tier pagoda -->
  <rect x="29.4" y="16.4" width="5.2" height="4" fill="#e8dcc8" stroke="#8a6f52" stroke-width="0.6" />
  <path d="M27.6 16.6 L32 13.8 L36.4 16.6 Z" fill="#b3402e" stroke="#7e2c20" stroke-width="0.6" />
  <rect x="30.2" y="11.2" width="3.6" height="2.6" fill="#e8dcc8" stroke="#8a6f52" stroke-width="0.5" />
  <path d="M28.8 11.4 L32 9 L35.2 11.4 Z" fill="#b3402e" stroke="#7e2c20" stroke-width="0.5" />
  <path d="M31.4 9 L32 6.6 L32.6 9 Z" fill="#b3402e" stroke="#7e2c20" stroke-width="0.5" />

  <!-- pine at the ledge edge -->
  <path d="M21.5 20 L24 15.5 L26.5 20 Z" fill="#3f6b3a" stroke="#2e4f2b" stroke-width="0.7" />
  <rect x="23.5" y="20" width="1" height="2" fill="#5b4633" />
</svg>
